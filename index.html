<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yoobify - خريطة الجزائر</title>

  <!-- تغيير لون رأس المتصفح -->
  <meta name="theme-color" content="#6a5acd" />
  <meta name="msapplication-navbutton-color" content="#6a5acd" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden; /* منع الاهتزاز */
      background: linear-gradient(to top, #ffb6c1 0%, #dda0dd 40%, #9370db 70%, #6a5acd 100%);
      position: relative;
    }

    .logo {
      font-size: 3.5rem;
      font-weight: 700;
      color: #ffebee;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      margin-bottom: 30px;
      text-align: center;
    }

    .search-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 2px solid #fff;
      border-radius: 20px;
      padding: 8px 12px;
      background-color: #fff;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      flex-wrap: wrap;
      z-index: 2;
    }

    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px;
      font-size: 1rem;
      background: transparent;
      color: #000;
      min-width: 180px;
    }

    .clear-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      color: #999;
      cursor: pointer;
      margin-right: 5px;
    }

    .clear-btn:hover {
      color: #333;
    }

    .vertical-line {
      width: 1px;
      height: 30px;
      background-color: #ccc;
      margin: 0 10px;
    }

    .icon-buttons {
      display: flex;
      flex-direction: row;
      gap: 10px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      stroke: #333;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.3s;
    }

    .icon-btn:hover svg {
      stroke: #000;
    }

    .language {
      margin-top: 25px;
      font-size: 1rem;
      z-index: 2;
      background-color: rgba(0, 0, 0, 0.4);
      padding: 10px 25px;
      border-radius: 10px;
      color: #ffffff;
      text-align: center;
    }

    .language a {
      color: #00ff7b;
      text-decoration: none;
      font-weight: 500;
    }

    .language a:hover {
      text-decoration: underline;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      font-size: 0.9rem;
      color: #333;
      z-index: 2;
      text-align: center;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.7); }
    }

    .snowflake {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 1.5em;
      user-select: none;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: linear;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0.8; }
    }

    /* 📱 Responsiveness */
    @media (max-width: 600px) {
      .logo {
        font-size: 2.5rem;
      }

      .search-bar {
        flex-direction: column;
        align-items: stretch;
        border-radius: 20px;
        padding: 10px;
      }

      .vertical-line {
        display: none;
      }

      .icon-buttons {
        justify-content: space-around;
        margin-top: 10px;
        width: 100%;
      }

      .clear-btn {
        align-self: flex-end;
        margin-top: 8px;
      }

      .language {
        font-size: 0.9rem;
        padding: 8px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">Yoobify</div>

  <div class="search-bar">
    <input id="searchInput" type="text" placeholder="ابحث عن موقع في الجزائر...">
    <button id="clearBtn" class="clear-btn" onclick="clearSearch()" title="حذف">×</button>
    <div class="vertical-line"></div>
    <div class="icon-buttons">
      <button class="icon-btn" title="بحث">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.65" y1="16.65" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" title="خريطة">
        <svg viewBox="0 0 24 24">
          <polygon points="2 6 9 3 15 6 22 3 22 18 15 21 9 18 2 21 2 6"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" title="إرسال">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="language">
    متاح بلغات أخرى: <a href="#">اللغة الأمازيغية</a>
  </div>

  <div class="footer">
    © 2025 Yoobify - جميع الحقوق محفوظة
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    input.addEventListener('input', () => {
      clearBtn.style.display = input.value ? 'inline' : 'none';
    });

    function clearSearch() {
      input.value = '';
      clearBtn.style.display = 'none';
      input.focus();
    }

    // الثلوج
    function createSnowflake() {
      const snowflake = document.createElement("div");
      snowflake.classList.add("snowflake");
      snowflake.textContent = "❄";
      snowflake.style.left = Math.random() * window.innerWidth + "px";
      snowflake.style.fontSize = (Math.random() * 15 + 10) + "px";
      const duration = (Math.random() * 6 + 6) + "s";
      snowflake.style.animationDuration = duration;
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), parseFloat(duration) * 1000);
    }
    setInterval(createSnowflake, 200);

    // النجوم
    function createStar() {
      const star = document.createElement("div");
      star.classList.add("star");
      star.style.left = Math.random() * window.innerWidth + "px";
      star.style.top = Math.random() * window.innerHeight + "px";
      const size = (Math.random() * 2 + 1) + "px";
      star.style.width = size;
      star.style.height = size;
      document.body.appendChild(star);
    }
    for (let i = 0; i < 100; i++) {
      createStar();
    }
  </script>
</body>
</html>
